when:
  - event: manual
  - event: pull_request

# The `path` condition can't be put on the workflow, because then the branch
# protection is never fulfilled if it doesn't run. So it has to be on the steps

variables:
  - &when
    path:
      include: ["src/**", "tests/**"]

steps:
  get-token:
    image: code.cartoon-aa.xyz/ci/ci-forgejo-token:13.0.1
    pull: true
    when:
      <<: *when
    settings:
      timeout: 15
      instance: http://forgejo-testing:3000/
      user: TestingAdmin
      password: password
      output_file: .token
  test:
    image: rust
    when:
      <<: *when
    environment:
      FORGEJO_API_CI_INSTANCE_URL: http://forgejo-testing:3000/
    commands:
      - export FORGEJO_API_CI_TOKEN=$(cat .token)
      - cargo test -F sync
  preserve:
    image: code.cartoon-aa.xyz/ci/ci-forgejo-preserve:13.0.1
    pull: true
    when:
      - status: [ failure ]
    settings:
      work_dir: ./forgejo
      package: Cyborus/forgejo-api-test-failure-archive
      instance: https://code.cartoon-aa.xyz/
      token:
        from_secret: preserve_token


services:
  forgejo-testing:
    image: code.cartoon-aa.xyz/ci/ci-forgejo:13.0.1
    pull: true
    when:
      <<: *when
    settings:
      host: forgejo-testing
      work_dir: ./forgejo
      users:
        - name: TestingAdmin
          password: password
          admin: true
      config:
        quota:
          enabled: true
