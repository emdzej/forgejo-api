workspace = { members = ["generator"] }
[package]
name = "forgejo-api"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://codeberg.org/Cyborus/forgejo-api"
description = "Interface to Forgejo's Web API"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "system-proxy", "json", "multipart"] }
soft_assert = "0.1.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["net"] }
url = { version = "2.5.8", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.53", features = ["parsing", "serde", "formatting"] }
serde_json = "1.0.150"
bytes = "1.12.1"
base64ct = "1.8.3"
zeroize = "1.9.0"
futures = "0.3.32"
urlencoding = "2.1.3"

[features]
default = ["reqwest/default-tls"]
sync = ["reqwest/blocking"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dev-dependencies]
eyre = "0.6.12"
reqwest = { version = "0.13", features = ["cookies", "form"] }
tokio = { version = "1.52.3", features = ["net", "fs", "rt", "macros"] }
